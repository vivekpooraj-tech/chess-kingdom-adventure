apply plugin: 'com.android.application'

// Release signing credentials are loaded from a local, untracked properties
// file at build time — never hardcoded here. Checked in this order:
//   1. CHESSMIND_RELEASE_KEYSTORE_PROPERTIES env var (for CI/other machines)
//   2. android/keystore.properties (the conventional location, gitignored —
//      see android/.gitignore's "Keystore files" section) IN THIS project
//   3. the known local checkout that already has both the properties file
//      and the referenced keystore sitting next to each other correctly
//   4. a personal backup copy, last resort
// Required fields inside: storeFile, storePassword, keyAlias, keyPassword.
// storeFile is a path RELATIVE TO THE PROPERTIES FILE ITSELF (not this
// project's rootDir) — the properties file and the "app/keystore/..." path
// it names are authored together as a pair, and only resolve correctly
// against each other; resolving against whichever project happens to be
// building would silently look in the wrong place in a second checkout or
// worktree. If nothing is found (e.g. a contributor's machine without
// release credentials), release builds simply stay unsigned — exactly
// today's behaviour — rather than failing every other Gradle task.
def releaseKeystorePropertiesFile =
    (System.getenv("CHESSMIND_RELEASE_KEYSTORE_PROPERTIES") ? file(System.getenv("CHESSMIND_RELEASE_KEYSTORE_PROPERTIES")) : null) ?:
    (file("$rootDir/keystore.properties").exists() ? file("$rootDir/keystore.properties") : null) ?:
    (file("C:/Users/91990/Downloads/Chess kingdom/android/keystore.properties").exists() ? file("C:/Users/91990/Downloads/Chess kingdom/android/keystore.properties") : null) ?:
    file("C:/Users/91990/OneDrive/Desktop/Websites/Chess mind/playstore cred/keystore.properties")

def hasReleaseSigning = releaseKeystorePropertiesFile.exists()
def releaseKeystoreProperties = new Properties()
if (hasReleaseSigning) {
    releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))
}

android {
    namespace = "com.chesskingdom.adventure"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chesskingdom.adventure"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(new File(releaseKeystorePropertiesFile.parentFile, releaseKeystoreProperties['storeFile'].toString()))
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
