ext {
    minSdkVersion = 24
    // Stable Platform 36 (Android 16) — the minimum Google Play requires
    // for new app submissions and updates, and also the highest compileSdk
    // the project's current Android Gradle Plugin (8.13.0) supports (its
    // documented max is API 36.1). API 37 exists and is itself stable, but
    // building against it needs a newer AGP than this project currently
    // uses — a separate upgrade, not done here.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}