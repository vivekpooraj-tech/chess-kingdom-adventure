ext {
    minSdkVersion = 24
    // Re-verified 2026-09-14 for the release-candidate build: android-36 is
    // STILL an incomplete local install on this machine (its platform
    // folder has no android.jar at all — confirmed by direct inspection),
    // so it cannot compile anything, debug or release. android-37.0 IS
    // fully installed (android.jar present, ~43MB) and its own
    // source.properties carries no CodeName/BetaVersion and
    // PreviewSdkInt=0 — i.e. it is registered as a stable release, not a
    // preview channel package. The original "37 is a preview API level"
    // note above was accurate when written but is stale now that a
    // complete, stable 37 platform is installed. 37 is therefore the
    // correct, verified choice for both compileSdk and targetSdk — not a
    // guess, and not something to downgrade to 36 (which would simply fail
    // to build on this machine).
    compileSdkVersion = 37
    targetSdkVersion = 37
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}